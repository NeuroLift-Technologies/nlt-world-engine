<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; frame-ancestors 'none'; form-action 'none';"
    />
    <meta name="description" content="NLT World Engine — Observer. Read-only replay viewer for simulation traces." />
    <title>NLT World Engine — Observer</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar" role="banner">
        <div class="top-bar-title">NLT World Engine — Observer</div>
        <span id="fixture-badge" class="panel-subtitle"></span>
        <div class="top-bar-spacer"></div>
        <div class="level-row" aria-label="Reading level">
          <button class="level-btn active" data-level="simple">Simple</button>
          <button class="level-btn" data-level="coach">Coach</button>
          <button class="level-btn" data-level="technical">Technical</button>
        </div>
      </header>

      <div class="env-header" id="env-header" aria-live="polite"></div>

      <main class="shell-main" role="main">
        <aside class="left-rail" aria-label="Avatar state">
          <section class="panel" aria-labelledby="panel-avatar-title">
            <header class="panel-header">
              <div>
                <div id="panel-avatar-title" class="panel-title">Avatar State</div>
                <div id="avatar-subtitle" class="panel-subtitle">no document yet</div>
              </div>
            </header>
            <div class="panel-body" id="avatar-body">
              <div style="color: var(--text-dim); font-size: 12px;">Waiting for a state feed.</div>
            </div>
          </section>

          <section class="panel" aria-labelledby="panel-independence-title">
            <header class="panel-header">
              <div id="panel-independence-title" class="panel-title">Independence</div>
            </header>
            <div class="panel-body compact" id="independence-body"></div>
          </section>
        </aside>

        <section class="viewport-area" aria-label="World viewport">
          <canvas id="plot" class="viewport-canvas" role="img" aria-label="Agent positions in the horizontal (x, z) plane"></canvas>
        </section>

        <aside class="right-rail" aria-label="Events and logs">
          <section class="panel" aria-labelledby="panel-events-title">
            <header class="panel-header">
              <div id="panel-events-title" class="panel-title">Recent Events</div>
            </header>
            <div class="panel-body" id="events-body"></div>
          </section>

          <section class="panel" aria-labelledby="panel-log-title">
            <header class="panel-header">
              <div>
                <div id="panel-log-title" class="panel-title">Intents &amp; Results</div>
                <div id="log-count" class="panel-subtitle">0 entries</div>
              </div>
            </header>
            <div class="panel-body" id="log-list" role="log" aria-live="polite"></div>
          </section>
        </aside>
      </main>

      <div class="minimap" aria-label="Minimap">
        <div class="minimap-header">MAP</div>
        <canvas id="minimap" class="minimap-canvas" width="192" height="214"></canvas>
      </div>

      <section class="timeline-section" aria-label="Timeline">
        <div class="timeline-header">
          <span>Learning Timeline</span>
          <span id="tick-label">Tick <span id="tick-value">0</span> / <span id="tick-range">0</span></span>
        </div>
        <div class="timeline-canvas-wrap" id="timeline">
          <canvas id="timeline-canvas" class="timeline-canvas"></canvas>
        </div>
      </section>

      <section class="transport" aria-label="Playback controls">
        <button id="btn-play" class="tp-button" aria-pressed="false" aria-label="Play">▶ Play</button>
        <button id="btn-pause" class="tp-button" aria-pressed="true" aria-label="Pause" hidden>⏸ Pause</button>
        <button id="btn-step-back" class="tp-button" aria-label="Step back">◀ Back</button>
        <button id="btn-step-fwd" class="tp-button" aria-label="Step forward">Next ▶</button>
        <button id="btn-live" class="tp-button" aria-label="Jump to latest">Latest</button>
        <button id="btn-replay" class="tp-button" aria-label="Restart">⟲ Replay</button>
        <span class="tp-sep"></span>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);">
          Speed
          <select id="sel-speed" style="font:inherit;font-size:12px;padding:3px 6px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:4px;">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </label>
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:200px;">
          <input id="scrubber" type="range" min="0" max="100" value="0" step="1" style="flex:1;cursor:pointer;" />
        </div>
        <span class="tp-spacer"></span>
        <span id="shell-meta" class="tp-status"></span>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
