[plugin]

name="Fusion Agent Loop"
description="Session-only opt-in for the local GGUF agent loop. Sets NLT_AGENT_LOOP_ENABLED and NLT_AGENT_LOOP_ENDPOINT for the game process so the loop can be exercised from the editor without a PowerShell step, without persisting the opt-in into Main.tscn."
author="NLT"
version="0.1.0"
script="plugin.gd"