name: World Engine v2 Build

on:
  push:
    paths:
      - 'world-engine-v2/**'
  pull_request:
    paths:
      - 'world-engine-v2/**'

jobs:
  build:
    name: tsc + vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world-engine-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: world-engine-v2/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build